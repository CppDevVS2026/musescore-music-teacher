name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run theory-engine unit tests
        run: node --test
      - name: Install MCP server dependencies
        working-directory: mcp-server
        run: npm install
      - name: Build MCP server
        working-directory: mcp-server
        run: npx tsc --noEmit
